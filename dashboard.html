<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Artio — Tableau de bord</title>
<link rel="icon" type="image/png" href="artio-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="plan-guard.js"></script>
<script src="tour.js?v=1"></script>
<script>const PAGE_PLAN_REQUIRED = "solo";</script>
<style>
:root, [data-theme="dark"] {
  --bg:        #080b14;
  --surface:   #0e1220;
  --surface-2: #141829;
  --surface-3: #1a2035;
  --border:    rgba(255,255,255,0.07);
  --border-hi: rgba(255,255,255,0.13);
  --text:      #e2e5f1;
  --muted:     #6b7494;
  --amber:     #f5a742;
  --amber-dim: rgba(245,167,66,0.12);
  --amber-glow:rgba(245,167,66,0.26);
  --teal:      #3ecfcf;
  --teal-dim:  rgba(62,207,207,0.11);
  --green:     #4ade80;
  --green-dim: rgba(74,222,128,0.11);
  --purple:    #a78bfa;
  --purple-dim:rgba(167,139,250,0.11);
  --red:       #f87171;
  --red-dim:   rgba(248,113,113,0.10);
  --fh: 'Space Grotesk', sans-serif;
  --fb: 'Plus Jakarta Sans', sans-serif;
  --fm: 'JetBrains Mono', monospace;
  --nav-h: 60px;
  --r: 14px;
}

[data-theme="light"] {
  --bg:        #faf8f3;
  --surface:   #ffffff;
  --surface-2: #f3efe6;
  --surface-3: #ece7dc;
  --border:    rgba(20,18,12,0.08);
  --border-hi: rgba(20,18,12,0.16);
  --text:      #1a1a1f;
  --muted:     #6a6b78;
  --amber:     #d97706;
  --amber-dim: rgba(217,119,6,0.10);
  --amber-glow:rgba(217,119,6,0.22);
  --teal:      #0d9488;
  --teal-dim:  rgba(13,148,136,0.10);
  --green:     #16a34a;
  --green-dim: rgba(22,163,74,0.10);
  --purple:    #7c3aed;
  --purple-dim:rgba(124,58,237,0.10);
  --red:       #dc2626;
  --red-dim:   rgba(220,38,38,0.08);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--fb); background: var(--bg); color: var(--text); min-height: 100vh; }

/* ── NAV ── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  height: var(--nav-h); padding: 0 20px 0 66px;
  display: flex; align-items: center; gap: 16px;
  background: rgba(8,11,20,0.85); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
}
.nav-logo { font-family: var(--fh); font-size: 18px; font-weight: 700; color: var(--text); letter-spacing:-0.02em; text-decoration:none; flex-shrink:0; }
.nav-links { display: flex; gap: 3px; flex: 1; justify-content: center; overflow-x: auto; }
.nav-link { padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 500; color: var(--muted); text-decoration: none; white-space: nowrap; border: none; background: transparent; cursor: pointer; font-family: var(--fb); transition: color .2s, background .2s; }
.nav-link:hover { color: var(--text); background: var(--surface); }
.nav-link.active { color: var(--amber); background: var(--amber-dim); font-weight: 600; }
.btn-logout { padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 500; background: transparent; border: 1px solid var(--border); color: var(--muted); cursor: pointer; font-family: var(--fb); transition: all .2s; }
.btn-logout:hover { border-color: var(--border-hi); color: var(--text); }

/* ── PAGE ── */
.page { position: relative; z-index: 1; padding: calc(var(--nav-h) + 28px) 28px 64px; max-width: 1180px; margin: 0 auto; }

/* ambient blobs */
body::before {
  content:''; position:fixed; top:-200px; right:-150px;
  width:600px; height:600px; border-radius:50%;
  background: radial-gradient(circle, var(--amber-glow) 0%, transparent 60%);
  opacity:.45; pointer-events:none; z-index:0;
}
body::after {
  content:''; position:fixed; bottom:-200px; left:-100px;
  width:500px; height:500px; border-radius:50%;
  background: radial-gradient(circle, rgba(62,207,207,0.13) 0%, transparent 60%);
  opacity:.55; pointer-events:none; z-index:0;
}

/* ── HEADER ── */
.header { display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap; margin-bottom: 24px; }
.header-left { display:flex; flex-direction:column; gap:6px; }
.eyebrow { font-family: var(--fm,'JetBrains Mono',monospace); font-size: 11px; color: var(--muted); letter-spacing:.12em; text-transform: uppercase; display:flex; align-items:center; gap:8px; }
.eyebrow::before { content:''; width:6px; height:6px; border-radius:50%; background: var(--amber); box-shadow: 0 0 12px var(--amber-glow); }
.page-title { font-family: var(--fh); font-size: 30px; font-weight: 700; letter-spacing: -0.025em; }
.page-sub { font-size: 13px; color: var(--muted); }

.controls { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.seg { display:inline-flex; background: var(--surface); border:1px solid var(--border); border-radius: 10px; padding: 3px; }
.seg button { font-family: var(--fb); font-size: 12px; font-weight: 500; padding: 6px 12px; border: none; background: transparent; color: var(--muted); border-radius: 7px; cursor: pointer; transition: all .15s; }
.seg button.on { background: var(--surface-3); color: var(--text); }
[data-theme="light"] .seg button.on { background: var(--surface-2); color: var(--text); }
.btn-ghost { font-family: var(--fb); font-size: 12px; padding: 7px 12px; border-radius: 9px; border:1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; display:inline-flex; align-items:center; gap:6px; }
.btn-ghost:hover { border-color: var(--border-hi); }
.btn-primary { font-family: var(--fb); font-size: 12px; font-weight: 600; padding: 7px 14px; border-radius: 9px; border:1px solid transparent; background: var(--amber); color: #080b14; cursor: pointer; display:inline-flex; align-items:center; gap:6px; }
.btn-primary:hover { filter: brightness(1.05); }
.date-input { padding: 7px 10px; border-radius: 9px; font-size: 12px; background: var(--surface); border: 1px solid var(--border); color: var(--text); font-family: var(--fb); outline: none; cursor: pointer; }
.date-input:focus { border-color: var(--amber); }
.date-sep { font-size: 13px; color: var(--muted); }

/* ── HERO ROW ── */
.hero-grid { display:grid; grid-template-columns: 1.55fr 1fr; gap: 14px; margin-bottom: 14px; }
@media(max-width:880px){ .hero-grid { grid-template-columns: 1fr; } }
.hero-card { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 26px 28px 0; display:flex; flex-direction:column; }
.hero-card::before { content:''; position:absolute; inset:0; background: radial-gradient(120% 80% at 0% 0%, var(--amber-dim) 0%, transparent 50%), radial-gradient(80% 70% at 100% 100%, var(--teal-dim) 0%, transparent 55%); pointer-events:none; }
.hero-card > * { position: relative; z-index:1; }
.hero-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 8px; }
.hero-label { font-family: var(--fm,monospace); font-size: 11px; color: var(--muted); letter-spacing:.1em; text-transform: uppercase; }
.hero-delta { display:inline-flex; align-items:center; gap:5px; font-family: var(--fm,monospace); font-size: 11px; font-weight: 600; background: var(--green-dim); color: var(--green); padding: 4px 9px; border-radius: 100px; }
.hero-delta.dn { background: var(--red-dim); color: var(--red); }
.hero-value { font-family: var(--fh); font-size: 52px; font-weight: 700; letter-spacing: -0.035em; line-height: 1; margin-top: 8px; color: var(--text); }
.hero-value .unit { font-size: 28px; color: var(--muted); margin-left: 6px; font-weight: 500; }
.hero-meta { display:flex; gap: 22px; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); padding-bottom: 18px; flex-wrap: wrap; }
.hero-meta-item { display:flex; flex-direction:column; gap:3px; }
.hero-meta-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing:.08em; font-weight: 600; }
.hero-meta-val { font-family: var(--fh); font-size: 16px; font-weight: 600; }
.sparkline { margin: 8px -28px 0; height: 84px; position: relative; }

/* ── CONVERSION RING ── */
.ring-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px 24px; display:flex; flex-direction:column; gap: 12px; position: relative; overflow: hidden; }
.ring-card::before { content:''; position: absolute; top:0; right:0; width: 200px; height: 200px; background: radial-gradient(circle at 70% 30%, var(--purple-dim), transparent 70%); pointer-events:none; }
.ring-head { display:flex; align-items:center; justify-content:space-between; position:relative; }
.ring-title { font-family: var(--fh); font-size: 14px; font-weight: 700; }
.ring-body { display:flex; align-items:center; gap:18px; position:relative; }
.ring-svg { flex-shrink: 0; }
.ring-bg { stroke: var(--surface-3); }
[data-theme="light"] .ring-bg { stroke: var(--surface-2); }
.ring-fg { stroke: var(--purple); stroke-linecap: round; transition: stroke-dashoffset .8s ease; filter: drop-shadow(0 0 6px var(--purple-dim)); }
.ring-percent { font-family: var(--fh); font-size: 26px; font-weight: 700; fill: var(--text); }
.ring-stats { display:flex; flex-direction:column; gap:10px; flex:1; }
.ring-stat { display:flex; align-items:baseline; justify-content:space-between; gap:8px; }
.ring-stat-label { font-size: 12px; color: var(--muted); display:flex; align-items:center; gap:7px; }
.ring-stat-label::before { content:''; width:8px; height:8px; border-radius: 2px; }
.ring-stat-label.acc::before { background: var(--purple); }
.ring-stat-label.att::before { background: var(--surface-3); border:1px solid var(--border-hi); }
.ring-stat-val { font-family: var(--fh); font-weight: 700; font-size: 14px; }

/* ── KPI MICRO ROW ── */
.kpi-row { display:grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 14px; }
@media(max-width:760px){ .kpi-row { grid-template-columns: 1fr; } }
.kpi-mini { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 18px 22px; display:flex; flex-direction:column; gap:8px; position:relative; overflow: hidden; }
.kpi-mini-head { display:flex; align-items:center; justify-content:space-between; }
.kpi-mini-label { font-family: var(--fm,monospace); font-size: 11px; color: var(--muted); letter-spacing:.08em; text-transform: uppercase; }
.kpi-mini-icon { width:28px; height:28px; border-radius: 8px; display:flex; align-items:center; justify-content:center; }
.kpi-mini-icon.teal { background: var(--teal-dim); color: var(--teal); }
.kpi-mini-icon.green { background: var(--green-dim); color: var(--green); }
.kpi-mini-icon.amber { background: var(--amber-dim); color: var(--amber); }
.kpi-mini-value { font-family: var(--fh); font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.kpi-mini-value.teal { color: var(--teal); }
.kpi-mini-value.green { color: var(--green); }
.kpi-mini-value.amber { color: var(--amber); }
.kpi-mini-sub { font-size: 11px; color: var(--muted); display:flex; align-items:center; gap:6px; }

/* ── MAIN GRID ── */
.main-grid { display:grid; grid-template-columns: 1.6fr 1fr; gap: 14px; margin-bottom: 14px; }
@media(max-width:980px){ .main-grid { grid-template-columns: 1fr; } }

/* ── CARD ── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px 24px; }
.card-head { display:flex; align-items:center; justify-content:space-between; margin-bottom: 18px; flex-wrap:wrap; gap:10px; }
.card-title { font-family: var(--fh); font-size: 15px; font-weight: 700; }
.card-title .accent { color: var(--muted); font-weight: 400; margin-left: 6px; }

/* ── CHART ── */
.bar-chart { display:flex; align-items:flex-end; gap: 14px; height: 200px; padding-top: 22px; position:relative; }
.bar-chart::before { content:''; position:absolute; left:0; right:0; top: 22px; bottom: 22px; background-image: linear-gradient(to bottom, var(--border) 1px, transparent 1px); background-size: 100% 33.33%; opacity: .8; pointer-events: none; }
.bar-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:8px; height:100%; position:relative; }
.bar-track { flex:1; width:100%; display:flex; align-items:flex-end; position:relative; z-index:1; }
.bar-fill { width:100%; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--amber) 0%, rgba(245,167,66,.35) 100%); position:relative; transition: height .6s cubic-bezier(.4,0,.2,1); min-height: 4px; }
.bar-fill::after { content:''; position:absolute; top:-1px; left:0; right:0; height:2px; background: var(--amber); border-radius: 2px; box-shadow: 0 0 12px var(--amber-glow); }
.bar-fill.empty { background: var(--surface-3); }
.bar-fill.empty::after { display: none; }
.bar-fill.current { background: linear-gradient(180deg, var(--teal) 0%, rgba(62,207,207,.35) 100%); }
.bar-fill.current::after { background: var(--teal); box-shadow: 0 0 12px var(--teal-dim); }
.bar-label { font-family: var(--fm,monospace); font-size: 10px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.bar-val { font-family: var(--fh); font-size: 11px; font-weight: 600; color: var(--text); }

/* tooltip interactif au survol */
.bar-col { cursor: pointer; }
.bar-tooltip {
  position: absolute;
  bottom: calc(100% + 8px);
  left: 50%;
  transform: translateX(-50%);
  background: var(--surface);
  border: 1px solid var(--border-hi);
  border-radius: 8px;
  padding: 8px 12px;
  white-space: nowrap;
  font-family: var(--fb);
  font-size: 12px;
  color: var(--text);
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s, transform .15s;
  z-index: 10;
  box-shadow: 0 8px 24px rgba(0,0,0,0.25);
}
[data-theme="light"] .bar-tooltip { box-shadow: 0 8px 24px rgba(20,18,12,0.12); }
.bar-tooltip-month { font-family: var(--fm,monospace); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 2px; }
.bar-tooltip-val { font-family: var(--fh); font-weight: 700; color: var(--amber); }
.bar-col:hover .bar-tooltip { opacity: 1; transform: translateX(-50%) translateY(-2px); }
.bar-col:hover .bar-fill { filter: brightness(1.15); }

/* ── ACTIVITY LIST ── */
.activity { display:flex; flex-direction:column; gap: 2px; }
.activity-item { display:flex; align-items:center; gap: 12px; padding: 10px 4px; border-bottom: 1px dashed var(--border); }
.activity-item:last-child { border-bottom: none; }
.activity-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink:0; }
.activity-dot.amber { background: var(--amber); box-shadow: 0 0 8px var(--amber-glow); }
.activity-dot.green { background: var(--green); }
.activity-dot.purple { background: var(--purple); }
.activity-dot.teal { background: var(--teal); }
.activity-body { flex:1; min-width: 0; }
.activity-title { font-size: 13px; font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.activity-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.activity-amount { font-family: var(--fh); font-size: 13px; font-weight: 700; }
.activity-amount.amber { color: var(--amber); }
.activity-empty { padding: 28px 12px; text-align: center; color: var(--muted); font-size: 12px; }

/* ── TABLE ── */
.table-card { background: var(--surface); border:1px solid var(--border); border-radius: var(--r); overflow: hidden; }
.table-card-head { padding: 18px 24px; display:flex; align-items:center; justify-content:space-between; border-bottom: 1px solid var(--border); }
.search-box { display:flex; align-items:center; gap:8px; background: var(--bg); border:1px solid var(--border); border-radius:9px; padding: 6px 11px; }
[data-theme="light"] .search-box { background: var(--surface-2); }
.search-box input { background: transparent; border: none; outline: none; color: var(--text); font-family: var(--fb); font-size: 12px; width: 180px; }
.search-box input::placeholder { color: var(--muted); }
.table { display:grid; grid-template-columns: 32px 2fr 1.4fr 100px 110px 90px; }
.t-head { display: contents; }
.t-head > div { padding: 10px 12px; font-family: var(--fm,monospace); font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; background: var(--surface-2); border-bottom: 1px solid var(--border); }
.t-head > div:nth-child(5), .t-head > div:nth-child(6) { text-align: right; }
.t-row { display: contents; }
.t-row > div { padding: 14px 12px; font-size: 13px; border-bottom: 1px solid var(--border); display:flex; align-items:center; }
.t-row:last-child > div { border-bottom: none; }
.t-row:hover > div { background: var(--surface-2); }
.t-avatar { width: 26px; height: 26px; border-radius: 50%; font-family: var(--fh); font-size: 11px; font-weight: 700; color: #080b14; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.t-name { font-weight: 600; }
.t-meta { font-size: 11px; color: var(--muted); display:flex; gap:6px; align-items:center; }
.t-num { font-family: var(--fm,monospace); }
.t-ttc { font-family: var(--fh); font-weight: 700; color: var(--amber); justify-content: flex-end; }
.t-ht { color: var(--muted); font-family: var(--fm,monospace); font-size: 12px; justify-content: flex-end; }
.pill { display:inline-flex; align-items:center; gap: 5px; font-family: var(--fb); font-size: 10px; font-weight: 600; padding: 3px 9px; border-radius: 100px; text-transform: uppercase; letter-spacing: .04em; }
.pill::before { content:''; width:5px; height:5px; border-radius:50%; }
.pill.paid { background: var(--green-dim); color: var(--green); }
.pill.paid::before { background: var(--green); }
.pill.due { background: var(--amber-dim); color: var(--amber); }
.pill.due::before { background: var(--amber); }
.pill.draft { background: var(--surface-3); color: var(--muted); }
.pill.draft::before { background: var(--muted); }
.table-empty { padding: 36px 24px; text-align: center; color: var(--muted); font-size: 13px; }

@media(max-width:760px){
  .table { grid-template-columns: 32px 1.5fr 80px 90px; }
  .table .col-meta, .table .col-status { display:none; }
}

/* ── TVA CARD ── */
.tva-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 22px 24px; margin-top: 14px; position: relative; overflow:hidden; }
.tva-card::before { content:''; position:absolute; top:0; left:0; bottom:0; width: 3px; background: linear-gradient(180deg, var(--teal), transparent); }
.tva-head { display:flex; align-items:flex-start; justify-content:space-between; gap:18px; flex-wrap:wrap; margin-bottom: 18px; }
.tva-badges { display:flex; gap: 6px; margin-top: 8px; }
.badge { font-family: var(--fm,monospace); font-size: 10px; padding: 3px 9px; border-radius: 100px; letter-spacing:.04em; }
.badge.teal { background: var(--teal-dim); color: var(--teal); }
.badge.muted { background: var(--surface-2); color: var(--muted); border:1px solid var(--border); }
.tva-period { text-align:right; }
.tva-period-label { font-family: var(--fm,monospace); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.tva-period-val { font-family: var(--fh); font-size: 18px; font-weight: 700; margin-top: 4px; }
.tva-period-dates { font-family: var(--fm,monospace); font-size: 11px; color: var(--muted); margin-top: 2px; }
.tva-hero { background: linear-gradient(135deg, var(--teal-dim), transparent 80%); border: 1px solid rgba(62,207,207,0.25); border-radius: 12px; padding: 18px 22px; display:flex; align-items:center; justify-content:space-between; margin-bottom: 16px; }
.tva-hero-num { font-family: var(--fh); font-size: 34px; font-weight: 700; color: var(--teal); letter-spacing: -0.025em; line-height: 1; }
.tva-hero-label { font-family: var(--fm,monospace); font-size: 10px; color: var(--muted); letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
.tva-hero-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }
.tva-breakdown { display:grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media(max-width:660px){ .tva-breakdown { grid-template-columns: 1fr; } }
.tva-cell { background: var(--surface-2); border-radius: 10px; padding: 14px 16px; border-left: 2px solid var(--border-hi); }
.tva-cell.amber { border-left-color: var(--amber); }
.tva-cell.teal { border-left-color: var(--teal); }
.tva-cell-label { font-family: var(--fm,monospace); font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin-bottom: 6px; }
.tva-cell-val { font-family: var(--fh); font-size: 18px; font-weight: 700; }
.tva-cell.amber .tva-cell-val { color: var(--amber); }
.tva-cell.teal .tva-cell-val { color: var(--teal); }
.tva-cell-sub { font-size: 10px; color: var(--muted); margin-top: 4px; }
.tva-warning { margin-top: 14px; padding: 10px 14px; background: var(--red-dim); border: 1px solid rgba(248,113,113,0.2); border-radius: 8px; font-size: 11px; color: var(--muted); display:flex; gap:8px; align-items:flex-start; }

<script>
const SUPABASE_URL = "https://mwmexkoeqeyueqgdkkni.supabase.co";
const SUPABASE_KEY = "sb_publishable_dbf0DrGQr377jyftcE-rYw_SK5nzZJw";

const sb = window.sb = createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null, dossiers = [], filterType = "mois", filterFrom = "", filterTo = "", chartFilter = "6mois", chartFrom = "", chartTo = "", assujetti_tva = false, tva_frequence = "trimestrielle", tva_regime = "encaissements";
const now_ = new Date();
filterFrom = new Date(now_.getFullYear()-1, 0, 1).toISOString().slice(0,10);
filterTo   = now_.toISOString().slice(0,10);
// Le graphique a son propre range custom, indépendant des KPIs du haut.
// Par défaut on initialise sur les 6 derniers mois.
chartFrom  = new Date(now_.getFullYear(), now_.getMonth()-5, 1).toISOString().slice(0,10);
chartTo    = now_.toISOString().slice(0,10);

const MOIS      = ["Jan","Fév","Mar","Avr","Mai","Jun","Jul","Aoû","Sep","Oct","Nov","Déc"];
const MOIS_LONG = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];

function esc(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function fmt(n) { return Number(n||0).toLocaleString("fr-FR",{minimumFractionDigits:2,maximumFractionDigits:2}) + " €"; }

function parseDateFR(s) {
  if (!s) return new Date("");
  const p = s.split("/");
  if (p.length === 3) return new Date(p[2], p[1]-1, p[0]);
  return new Date(s);
}

function getAllDocs() {
  const docs = [];
  dossiers.forEach(dos => { (dos.documents||[]).forEach(d => docs.push({...d, _dosNom: dos.nom||dos.client||""})); });
  return docs;
}

function _docRefDate(d) {
  // Date de référence pour les filtres : pour une facture payée → date d'encaissement.
  // Sinon → date d'émission. Cohérent avec la logique URSSAF (encaissement).
  if (d.type === "facture" && d.paye && d.date_paye) return parseDateFR(d.date_paye);
  return parseDateFR(d.date);
}

function filterDocs(docs) {
  const now = new Date();
  if (filterType === "mois") return docs.filter(d => { const dt = _docRefDate(d); return dt && dt.getMonth() === now.getMonth() && dt.getFullYear() === now.getFullYear(); });
  if (filterType === "annee") return docs.filter(d => { const dt = _docRefDate(d); return dt && dt.getFullYear() === now.getFullYear(); });
  if (filterType === "custom" && filterFrom && filterTo) {
    const from = new Date(filterFrom), to = new Date(filterTo);
    return docs.filter(d => { const dt = _docRefDate(d); return dt && dt >= from && dt <= to; });
  }
  return docs;
}

function buildBars(caParMois, now) {
  const bars = [];
  if (chartFilter === "6mois") {
    for (let i=5; i>=0; i--) { const dt=new Date(now); dt.setMonth(dt.getMonth()-i); const k=dt.getFullYear()+"-"+dt.getMonth(); bars.push({label:MOIS[dt.getMonth()], val:caParMois[k]||0}); }
  } else if (chartFilter === "annee") {
    for (let i=0; i<12; i++) { const k=now.getFullYear()+"-"+i; bars.push({label:MOIS[i], val:caParMois[k]||0}); }
  } else if (chartFilter === "custom" && chartFrom && chartTo) {
    const from = new Date(chartFrom), to = new Date(chartTo);
    let cur = new Date(from.getFullYear(), from.getMonth(), 1);
    while (cur <= to) {
      const k = cur.getFullYear()+"-"+cur.getMonth();
      bars.push({label:MOIS[cur.getMonth()]+" "+String(cur.getFullYear()).slice(2), val:caParMois[k]||0});
      cur.setMonth(cur.getMonth()+1);
    }
  }
  return bars;
}

function calcKPIs() {
  const now = new Date();
  const all = getAllDocs();
  const filtered = filterDocs(all);
  const factures = filtered.filter(d => d.type === "facture" && d.paye);
  const devis    = filtered.filter(d => d.type === "devis");
  const caTotal  = factures.reduce((s,d) => s+(d.ttc||0), 0);
  const caHT     = factures.reduce((s,d) => s+(d.totalHT||0), 0);
  const tvaColl  = factures.reduce((s,d) => s+(d.tva||0), 0);
  // Ventilation TVA par taux
  const tvaParTaux = {};
  factures.forEach(d => {
    const taux = d.tvaRate || 0;
    if (taux > 0) {
      if (!tvaParTaux[taux]) tvaParTaux[taux] = { tva: 0, ht: 0, nb: 0 };
      tvaParTaux[taux].tva += d.tva || 0;
      tvaParTaux[taux].ht  += d.totalHT || 0;
      tvaParTaux[taux].nb  += 1;
    }
  });
  // CA encaissé du mois en cours : basé sur date_paye (logique URSSAF / encaissement)
  // Seules les factures avec paye:true sont comptées, sur leur date de paiement
  const caMois = (() => {
    let total = 0;
    all.forEach(d => {
      if (d.type !== "facture" || !d.paye) return;
      const ref = d.date_paye || d.date;
      const dt = parseDateFR(ref);
      if (dt && dt.getMonth() === now.getMonth() && dt.getFullYear() === now.getFullYear()) {
        total += d.ttc || 0;
      }
    });
    return total;
  })();
  const devisAtt = devis.filter(d => !d.accepte);
  const devisAcc = devis.filter(d => d.accepte);
  const caAttente  = devisAtt.reduce((s,d) => s+(d.ttc||0), 0);
  const caAccepte  = devisAcc.reduce((s,d) => s+(d.ttc||0), 0);
  // txConv calculé sur TOUTE l'année, pas sur la période filtrée
  const allDevisAnnee = all.filter(d => d.type==='devis' && (()=>{const dt=parseDateFR(d.date);return dt.getFullYear()===now.getFullYear();})());
  const allDevisAccAnnee = allDevisAnnee.filter(d => d.accepte);
  const txConv = allDevisAnnee.length > 0 ? Math.round(allDevisAccAnnee.length / allDevisAnnee.length * 100) : 0;
  // Graphique : CA encaissé par mois (basé sur date_paye, logique URSSAF)
  const caParMois = {};
  all.filter(d => d.type==="facture" && d.paye).forEach(d => {
    const ref = d.date_paye || d.date;
    const dt = parseDateFR(ref);
    if (!dt) return;
    const k = dt.getFullYear()+"-"+dt.getMonth();
    caParMois[k] = (caParMois[k]||0) + (d.ttc||0);
  });
  const bars = buildBars(caParMois, now);
  const caAnnuel = all.filter(d=>d.type==='facture' && d.paye).reduce((s,d)=>{const ref=d.date_paye||d.date;const dt=parseDateFR(ref);return dt && dt.getFullYear()===now.getFullYear()?s+(d.ttc||0):s;},0);
  return { caTotal, caHT, caAnnuel, tvaColl, tvaParTaux, caMois, caAttente, caAccepte, txConv, nbFactures:factures.length, nbDevis:devis.length, nbAttente:devisAtt.length, nbAccepte:devisAcc.length, bars, factures, devis };
}

function currentTVAPeriod() {
  const now = new Date();
  if (tva_frequence === "mensuelle") {
    const from = new Date(now.getFullYear(), now.getMonth(), 1);
    const to   = new Date(now.getFullYear(), now.getMonth()+1, 0);
    return { from: from.toISOString().slice(0,10), to: to.toISOString().slice(0,10), label: from.toLocaleDateString("fr-FR",{month:"long",year:"numeric"}) };
  }
  if (tva_frequence === "trimestrielle") {
    const q = Math.floor(now.getMonth()/3);
    const from = new Date(now.getFullYear(), q*3, 1);
    const to   = new Date(now.getFullYear(), q*3+3, 0);
    return { from: from.toISOString().slice(0,10), to: to.toISOString().slice(0,10), label: "T"+(q+1)+" "+now.getFullYear() };
  }
  const from = new Date(now.getFullYear(), 0, 1);
  const to   = new Date(now.getFullYear(), 11, 31);
  return { from: from.toISOString().slice(0,10), to: to.toISOString().slice(0,10), label: String(now.getFullYear()) };
}

window.onPeriodChange = function() {
  filterType = document.getElementById("period-type").value;
  const now = new Date();
  if (filterType === "mois") { filterFrom = new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10); filterTo = now.toISOString().slice(0,10); }
  else if (filterType === "annee") { filterFrom = new Date(now.getFullYear(),0,1).toISOString().slice(0,10); filterTo = now.toISOString().slice(0,10); }
  render();
};

function exportCSV() {
  const sep = ";";
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  const dateISO = v => {
    if (!v) return "";
    if (v.includes("/")) { const [d, m, y] = v.split("/"); return `${y}-${m}-${d}`; }
    return v.slice(0, 10);
  };

  const all = [];
  dossiers.forEach(dos => {
    (dos.documents || []).forEach(doc => {
      all.push({ ...doc, _dosNom: dos.nom || dos.client || "" });
    });
  });

  const filtered = filterDocs(all);

  const rows = [[
    "Type", "Numéro", "Date émission", "Date prestation", "Date paiement",
    "Client", "Dossier",
    "Total HT (€)", "TVA (€)", "Total TTC (€)",
    "Statut"
  ].map(q).join(sep)];

  filtered.forEach(doc => {
    rows.push([
      doc.type === "facture" ? "Facture" : "Devis",
      doc.docNumber || "",
      dateISO(doc.date),
      dateISO(doc.date_prestation),
      dateISO(doc.date_paye),
      doc.client?.nom || doc._dosNom || "",
      doc._dosNom || "",
      (doc.totalHT || 0).toFixed(2),
      (doc.tva || 0).toFixed(2),
      (doc.ttc || 0).toFixed(2),
      doc.type === "facture"
        ? (doc.paye ? "Payée" : "Impayée")
        : (doc.accepte ? "Accepté" : "En attente")
    ].map(q).join(sep));
  });

  const label = filterType === "mois" ? "mois-en-cours"
    : filterType === "annee" ? new Date().getFullYear()
    : (filterFrom || "debut") + "_" + (filterTo || "fin");

  const BOM = "﻿";
  const blob = new Blob([BOM + rows.join("\r\n")], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `artio-export-${label}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("✅ Export CSV téléchargé");
}

function getRecentActivity(limit = 5) {
  // Extrait les événements business des dossiers et trie par date desc
  const events = [];
  const now = new Date();
  dossiers.forEach(dos => {
    (dos.documents || []).forEach(doc => {
      const dosNom = dos.nom || dos.client || "—";
      if (doc.type === "facture") {
        // 1. Facture payée (priorité haute)
        if (doc.paye && doc.date_paye) {
          const dt = parseDateFR(doc.date_paye);
          if (dt) events.push({ type: "paye", dot: "green", dt, title: `Facture ${doc.docNumber||""} payée`, sub: `${dosNom}`, amount: doc.ttc });
        }
        // 2. Facture émise
        if (doc.date) {
          const dt = parseDateFR(doc.date);
          if (dt) events.push({ type: "emise", dot: "amber", dt, title: `Facture ${doc.docNumber||""} émise`, sub: `${dosNom}`, amount: doc.ttc });
        }
      } else if (doc.type === "devis" && doc.accepte) {
        // 3. Devis accepté
        const dt = parseDateFR(doc.date_acceptation || doc.date);
        if (dt) events.push({ type: "accepte", dot: "purple", dt, title: `Devis ${doc.docNumber||""} accepté`, sub: `${dosNom}`, amount: doc.ttc });
      }
    });
  });
  // Trie desc par date puis prend les N premiers
  events.sort((a, b) => b.dt - a.dt);
  return events.slice(0, limit).map(e => ({ ...e, ago: timeAgo(e.dt, now) }));
}

function timeAgo(dt, now) {
  const diff = Math.max(0, now - dt);
  const h = Math.floor(diff / 3600000);
  const d = Math.floor(diff / 86400000);
  if (h < 1) return "à l'instant";
  if (h < 24) return `il y a ${h} h`;
  if (d === 1) return "hier";
  if (d < 7) return `il y a ${d} j`;
  if (d < 30) return `il y a ${Math.floor(d/7)} sem.`;
  if (d < 365) return `il y a ${Math.floor(d/30)} mois`;
  return `il y a ${Math.floor(d/365)} an${Math.floor(d/365)>1?"s":""}`;
}

function pickInitials(name) {
  const s = String(name||"—").trim();
  if (!s) return "—";
  const words = s.split(/\s+/);
  if (words.length === 1) return s.slice(0,2).toUpperCase();
  return (words[0][0] + words[1][0]).toUpperCase();
}
function pickAvatarGradient(name) {
  const pals = [
    "linear-gradient(135deg,#f5a742,#e07a18)",
    "linear-gradient(135deg,#3ecfcf,#34d399)",
    "linear-gradient(135deg,#a78bfa,#ec4899)",
    "linear-gradient(135deg,#fbbf24,#fb923c)",
    "linear-gradient(135deg,#60a5fa,#a78bfa)",
  ];
  let h = 0;
  for (let i=0;i<(name||"").length;i++) h = ((h<<5)-h) + (name||"").charCodeAt(i);
  return pals[Math.abs(h) % pals.length];
}

function caAnneePrecedente() {
  const lastYear = new Date().getFullYear() - 1;
  let total = 0;
  dossiers.forEach(dos => (dos.documents||[]).forEach(d => {
    if (d.type === "facture" && d.paye) {
      const dt = parseDateFR(d.date_paye || d.date);
      if (dt && dt.getFullYear() === lastYear) total += d.ttc || 0;
    }
  }));
  return total;
}

function render() {
  const kpi = calcKPIs();
  const now = new Date();
  const maxBar = Math.max(...kpi.bars.map(b => b.val), 1);

  // Delta vs année précédente
  const caPrec = caAnneePrecedente();
  let deltaPct = null;
  if (caPrec > 0) deltaPct = Math.round(((kpi.caAnnuel - caPrec) / caPrec) * 100);

  // Custom inputs
  const customInputs = filterType === "custom" ? `
    <input type="date" class="date-input" value="${filterFrom}" onchange="filterFrom=this.value;render()" max="${new Date().toISOString().slice(0,10)}"/>
    <span class="date-sep">→</span>
    <input type="date" class="date-input" value="${filterTo}" onchange="filterTo=this.value;render()" max="${new Date().toISOString().slice(0,10)}"/>
  ` : "";

  // BARS
  const bars = kpi.bars.map((b, i) => {
    const pct = Math.round((b.val / maxBar) * 100);
    const isCurrent = (i === kpi.bars.length - 1);
    const valTxt = b.val > 0
      ? (b.val >= 1000 ? (Math.round(b.val/100)/10) + "k" : Math.round(b.val))
      : "";
    const tooltipVal = b.val > 0 ? fmt(b.val) : "Aucun encaissement";
    return `<div class="bar-col">
      <div class="bar-tooltip">
        <div class="bar-tooltip-month">${esc(b.label)}</div>
        <div class="bar-tooltip-val">${tooltipVal}</div>
      </div>
      <div class="bar-val">${valTxt ? valTxt + "€" : ""}</div>
      <div class="bar-track">
        <div class="bar-fill ${b.val===0?"empty":""} ${isCurrent && b.val>0?"current":""}" style="height:${Math.max(pct,2)}%"></div>
      </div>
      <div class="bar-label">${b.label}</div>
    </div>`;
  }).join("");

  // ACTIVITY
  const activity = getRecentActivity(5);
  const activityHTML = activity.length === 0
    ? `<div class="activity-empty">Aucune activité récente sur la période</div>`
    : activity.map(e => `
      <div class="activity-item">
        <span class="activity-dot ${e.dot}"></span>
        <div class="activity-body">
          <div class="activity-title">${esc(e.title)}</div>
          <div class="activity-sub">${esc(e.sub)} · ${e.ago}</div>
        </div>
        <div class="activity-amount amber">${e.amount ? fmt(e.amount).replace(" €", " €") : "—"}</div>
      </div>`).join("");

  // TABLE — 5 factures les plus récentes (toutes périodes)
  const allFactures = [];
  dossiers.forEach(dos => {
    (dos.documents||[]).forEach(d => {
      if (d.type === "facture") allFactures.push({ ...d, _dosNom: dos.nom || dos.client || "—" });
    });
  });
  allFactures.sort((a,b) => {
    const da = parseDateFR(a.date) || new Date(0);
    const db = parseDateFR(b.date) || new Date(0);
    return db - da;
  });
  const lastFactures = allFactures.slice(0, 5);

  const tableRows = lastFactures.length === 0
    ? `<div class="table-empty" style="grid-column:1/-1">Aucune facture pour le moment</div>`
    : lastFactures.map(d => {
        const grad = pickAvatarGradient(d._dosNom);
        const initials = pickInitials(d._dosNom);
        const pill = d.paye
          ? `<span class="pill paid">Payée</span>`
          : `<span class="pill due">À encaisser</span>`;
        const meta = d.label ? `#${esc(d.docNumber||"")} · ${esc(d.label)}` : `#${esc(d.docNumber||"")}`;
        return `<div class="t-row">
          <div><div class="t-avatar" style="background:${grad}">${esc(initials)}</div></div>
          <div><div><div class="t-name">${esc(d._dosNom)}</div><div class="t-meta">${meta}</div></div></div>
          <div class="col-meta t-meta"><span class="t-num">${esc(d.date||"—")}</span></div>
          <div class="col-status">${pill}</div>
          <div class="t-ttc">${fmt(d.ttc)}</div>
          <div class="t-ht">${fmt(d.totalHT)}</div>
        </div>`;
      }).join("");

  // RING — % en SVG : circonférence = 2*pi*48 ≈ 301.6
  const ringDash = 301.6;
  const ringOffset = ringDash * (1 - (kpi.txConv/100));

  // HERO DELTA
  const deltaHTML = deltaPct === null
    ? ""
    : `<span class="hero-delta ${deltaPct < 0 ? "dn" : ""}">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><polyline points="${deltaPct<0?"6 9 12 15 18 9":"18 15 12 9 6 15"}"/></svg>
        ${deltaPct >= 0 ? "+" : ""}${deltaPct}% vs ${now.getFullYear()-1}
      </span>`;

  // SPARKLINE — basé sur les 12 dernières barres avec courbe Bézier
  const sparkPath = (() => {
    const vals = kpi.bars.map(b => b.val);
    if (vals.length === 0) return "";
    const maxV = Math.max(...vals, 1);
    const w = 600, h = 80;
    const stepX = w / Math.max(vals.length - 1, 1);
    const pts = vals.map((v, i) => [i*stepX, h - (v/maxV)*h*0.85 - 6]);
    if (pts.length === 1) return `M0,${pts[0][1]} L${w},${pts[0][1]}`;
    let path = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 1; i < pts.length; i++) {
      const cx = (pts[i-1][0] + pts[i][0]) / 2;
      path += ` Q${cx},${pts[i-1][1]} ${cx},${(pts[i-1][1]+pts[i][1])/2}`;
      path += ` T${pts[i][0]},${pts[i][1]}`;
    }
    return path;
  })();
  const sparkArea = sparkPath ? `${sparkPath} L600,96 L0,96 Z` : "";
  const lastSparkX = 600;
  const lastSparkY = (() => {
    const vals = kpi.bars.map(b => b.val);
    if (vals.length === 0) return 50;
    const maxV = Math.max(...vals, 1);
    return Math.round(80 - (vals[vals.length-1]/maxV)*80*0.85 - 6);
  })();

  document.getElementById("main").innerHTML = `
    <!-- HEADER -->
    <div class="header">
      <div class="header-left">
        <div class="eyebrow">Tableau de bord · ${MOIS_LONG[now.getMonth()]} ${now.getFullYear()}</div>
        <h1 class="page-title">Votre activité</h1>
        <p class="page-sub">Les chiffres sont à jour à l'instant.</p>
      </div>
      <div class="controls">
        <div class="seg">
          <button class="${filterType==='mois'?'on':''}" onclick="document.getElementById('period-type').value='mois';onPeriodChange()">Mois</button>
          <button class="${filterType==='annee'?'on':''}" onclick="document.getElementById('period-type').value='annee';onPeriodChange()">Année</button>
          <button class="${filterType==='custom'?'on':''}" onclick="document.getElementById('period-type').value='custom';onPeriodChange()">Personnalisé</button>
        </div>
        <select id="period-type" style="display:none" onchange="onPeriodChange()">
          <option value="mois" ${filterType==="mois"?"selected":""}>Mois</option>
          <option value="annee" ${filterType==="annee"?"selected":""}>Année</option>
          <option value="custom" ${filterType==="custom"?"selected":""}>Personnalisé</option>
        </select>
        ${customInputs}
        <button class="btn-ghost" onclick="exportCSV()">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Export CSV
        </button>
      </div>
    </div>

    <!-- HERO ROW -->
    <div class="hero-grid">
      <div class="hero-card">
        <div class="hero-head">
          <span class="hero-label">Chiffre d'affaires · ${now.getFullYear()}</span>
          ${deltaHTML}
        </div>
        <div class="hero-value">${Math.round(kpi.caAnnuel).toLocaleString('fr-FR')}<span class="unit">€</span></div>
        <div class="hero-meta">
          <div class="hero-meta-item">
            <span class="hero-meta-label">CE MOIS</span>
            <span class="hero-meta-val" style="color:var(--teal)">${fmt(kpi.caMois)}</span>
          </div>
          <div class="hero-meta-item">
            <span class="hero-meta-label">HT (PÉRIODE)</span>
            <span class="hero-meta-val">${fmt(kpi.caHT)}</span>
          </div>
          <div class="hero-meta-item">
            <span class="hero-meta-label">FACTURES</span>
            <span class="hero-meta-val">${kpi.nbFactures}</span>
          </div>
        </div>
        <div class="sparkline">
          <svg viewBox="0 0 600 96" width="100%" height="96" preserveAspectRatio="none">
            <defs>
              <linearGradient id="sparkGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="var(--amber)" stop-opacity=".35"/>
                <stop offset="100%" stop-color="var(--amber)" stop-opacity="0"/>
              </linearGradient>
            </defs>
            ${sparkArea ? `<path d="${sparkArea}" fill="url(#sparkGrad)"/>` : ""}
            ${sparkPath ? `<path d="${sparkPath}" fill="none" stroke="var(--amber)" stroke-width="2" stroke-linecap="round"/>` : ""}
            ${sparkPath ? `<circle cx="${lastSparkX}" cy="${lastSparkY}" r="4" fill="var(--amber)"/><circle cx="${lastSparkX}" cy="${lastSparkY}" r="8" fill="var(--amber)" opacity=".25"/>` : ""}
          </svg>
        </div>
      </div>

      <div class="ring-card">
        <div class="ring-head">
          <div class="ring-title">Taux de conversion</div>
          <span class="badge muted">${now.getFullYear()}</span>
        </div>
        <div class="ring-body">
          <svg class="ring-svg" width="120" height="120" viewBox="0 0 120 120">
            <circle class="ring-bg" cx="60" cy="60" r="48" fill="none" stroke-width="12"/>
            <circle class="ring-fg" cx="60" cy="60" r="48" fill="none" stroke-width="12"
                    stroke-dasharray="${ringDash}" stroke-dashoffset="${ringOffset}"
                    transform="rotate(-90 60 60)"/>
            <text class="ring-percent" x="60" y="65" text-anchor="middle" dominant-baseline="middle">${kpi.txConv}%</text>
          </svg>
          <div class="ring-stats">
            <div class="ring-stat">
              <span class="ring-stat-label acc">Acceptés</span>
              <span class="ring-stat-val" style="color:var(--purple)">${kpi.nbAccepte}</span>
            </div>
            <div class="ring-stat">
              <span class="ring-stat-label att">En attente</span>
              <span class="ring-stat-val">${kpi.nbAttente}</span>
            </div>
            <div class="ring-stat" style="border-top:1px solid var(--border); padding-top:10px;">
              <span class="ring-stat-label" style="padding-left:13px">Montant signé</span>
              <span class="ring-stat-val" style="color:var(--amber)">${fmt(kpi.caAccepte)}</span>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- KPI MICRO ROW -->
    <div class="kpi-row">
      <div class="kpi-mini">
        <div class="kpi-mini-head">
          <span class="kpi-mini-label">Devis en attente</span>
          <div class="kpi-mini-icon amber">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
          </div>
        </div>
        <div class="kpi-mini-value amber">${fmt(kpi.caAttente)}</div>
        <div class="kpi-mini-sub"><span>${kpi.nbAttente} devis</span></div>
      </div>
      <div class="kpi-mini">
        <div class="kpi-mini-head">
          <span class="kpi-mini-label">Encaissé ce mois</span>
          <div class="kpi-mini-icon teal">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap=" round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
          </div>
        </div>
        <div class="kpi-mini-value teal">${fmt(kpi.caMois)}</div>
        <div class="kpi-mini-sub"><span>${MOIS_LONG[now.getMonth()]} ${now.getFullYear()}</span></div>
      </div>
      <div class="kpi-mini">
        <div class="kpi-mini-head">
          <span class="kpi-mini-label">Panier moyen</span>
          <div class="kpi-mini-icon green">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></svg>
          </div>
        </div>
        <div class="kpi-mini-value green">${kpi.nbFactures>0 ? fmt(kpi.caTotal/kpi.nbFactures) : "—"}</div>
        <div class="kpi-mini-sub"><span>Par facture</span></div>
      </div>
    </div>

    <!-- MAIN GRID : graphe + activité -->
    <div class="main-grid">
      <div class="card">
        <div class="card-head">
          <div class="card-title">CA mensuel <span class="accent">— ${chartFilter==='6mois'?'6 derniers mois':chartFilter==='annee'?'Année en cours':'Personnalisé'}</span></div>
          <div class="seg">
            <button class="${chartFilter==='6mois'?'on':''}" onclick="chartFilter='6mois';render()">6m</button>
            <button class="${chartFilter==='annee'?'on':''}" onclick="chartFilter='annee';render()">Année</button>
            <button class="${chartFilter==='custom'?'on':''}" onclick="chartFilter='custom';render()">Custom</button>
          </div>
        </div>
        ${chartFilter === "custom" ? `<div style="display:flex;gap:8px;margin-bottom:12px;align-items:center;">
          <input type="date" class="date-input" value="${chartFrom}" onchange="chartFrom=this.value;render()" max="${new Date().toISOString().slice(0,10)}"/>
          <span class="date-sep">→</span>
          <input type="date" class="date-input" value="${chartTo}" onchange="chartTo=this.value;render()" max="${new Date().toISOString().slice(0,10)}"/>
        </div>` : ""}
        <div class="bar-chart">${bars}</div>
      </div>

      <div class="card">
        <div class="card-head">
          <div class="card-title">Activité récente</div>
          <a href="dossiers.html" style="font-size:11px; color:var(--muted); text-decoration:none; font-family:var(--fm,monospace);">VOIR TOUT →</a>
        </div>
        <div class="activity">${activityHTML}</div>
      </div>
    </div>

    <!-- TABLE FACTURES -->
    <div class="table-card">
      <div class="table-card-head">
        <div class="card-title">Factures récentes</div>
        <a href="app.html" class="btn-primary" style="text-decoration:none">+ Nouvelle</a>
      </div>
      <div class="table">
        <div class="t-head">
          <div></div>
          <div>Dossier</div>
          <div class="col-meta">Émission</div>
          <div class="col-status">Statut</div>
          <div>TTC</div>
          <div>HT</div>
        </div>
        ${tableRows}
      </div>
    </div>

    ${(()=>{
      if(!assujetti_tva) return "";
      const tvaPeriod = currentTVAPeriod();
      const freqLabel   = {"mensuelle":"Mensuelle","trimestrielle":"Trimestrielle","annuelle":"Annuelle"}[tva_frequence]||"";
      const regimeLabel = tva_regime==="encaissements" ? "Sur les encaissements" : "Sur les débits";
      const regimeInfo  = tva_regime==="encaissements"
        ? "TVA due à la date du paiement reçu (prestations de service)"
        : "TVA due à la date d'émission de la facture (ventes de biens)";
      const ventilCells = Object.keys(kpi.tvaParTaux).sort().map(taux =>
        `<div class="tva-cell teal">
          <div class="tva-cell-label">② TVA ${taux}% collectée</div>
          <div class="tva-cell-val">${fmt(kpi.tvaParTaux[taux].tva)}</div>
          <div class="tva-cell-sub">Sur ${fmt(kpi.tvaParTaux[taux].ht)} HT · ${kpi.tvaParTaux[taux].nb} facture${kpi.tvaParTaux[taux].nb>1?"s":""}</div>
        </div>`
      ).join("") || `<div class="tva-cell teal">
        <div class="tva-cell-label">② TVA collectée</div>
        <div class="tva-cell-val">${fmt(kpi.tvaColl)}</div>
        <div class="tva-cell-sub">Aucune TVA facturée sur la période</div>
      </div>`;
      return `
    <div class="tva-card">
      <div class="tva-head">
        <div>
          <div class="card-title">Déclaration TVA</div>
          <div class="tva-badges">
            <span class="badge teal">${freqLabel}</span>
            <span class="badge muted">${regimeLabel}</span>
          </div>
          <div style="font-size:10px;color:var(--muted);margin-top:8px">ℹ️ ${regimeInfo}</div>
        </div>
        <div class="tva-period">
          <div class="tva-period-label">Période en cours</div>
          <div class="tva-period-val">${tvaPeriod.label}</div>
          <div class="tva-period-dates">${new Date(tvaPeriod.from).toLocaleDateString("fr-FR")} → ${new Date(tvaPeriod.to).toLocaleDateString("fr-FR")}</div>
        </div>
      </div>
      <div class="tva-hero">
        <div>
          <div class="tva-hero-label">TVA nette à reverser</div>
          <div class="tva-hero-num">${fmt(kpi.tvaColl)}</div>
          <div class="tva-hero-sub">Avant déduction de la TVA sur achats — consultez votre comptable.</div>
        </div>
        <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="var(--teal)" stroke-width="1.4" opacity=".5"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <div class="tva-breakdown">
        <div class="tva-cell amber">
          <div class="tva-cell-label">① CA HT à déclarer</div>
          <div class="tva-cell-val">${fmt(kpi.caHT)}</div>
          <div class="tva-cell-sub">Chiffre d'affaires hors taxes</div>
        </div>
        <div class="tva-cell">
          <div class="tva-cell-label">CA TTC encaissé</div>
          <div class="tva-cell-val">${fmt(kpi.caTotal)}</div>
          <div class="tva-cell-sub">Ce que vos clients ont payé</div>
        </div>
        ${ventilCells}
      </div>
      <div class="tva-warning">
        <span>⚠</span>
        <span>Ce calcul ne tient pas compte de la <strong>TVA déductible sur vos achats</strong>. Si vous avez des charges soumises à TVA, le montant réel à reverser peut être inférieur. Consultez votre comptable.</span>
      </div>
    </div>`;
    })()}`;
}


(function(){var b=document.getElementById("btn-logout");if(b)b.addEventListener("click",async()=>{await sb.auth.signOut();window.location.href="index.html";});})();

(async () => {
  try {
    const { data: { session } } = await sb.auth.getSession();
    if (!session) { window.location.href = "index.html"; return; }
    user = session.user;
    const [{ data, error }, profilRes] = await Promise.all([
      sb.from("dossiers").select("*").eq("user_id", user.id),
      sb.from("profils").select("*").eq("user_id", user.id).single()
    ]);
    if (error) console.error("Erreur dossiers:", error);
    const profil = profilRes.data || null;
    if (profilRes.error) console.warn("Profil:", profilRes.error.message);
    assujetti_tva  = profil?.assujetti_tva  || false;
    tva_frequence  = profil?.tva_frequence  || "trimestrielle";
    tva_regime     = profil?.tva_regime     || "encaissements";
    dossiers = (data||[]).map(d => { let docs = []; try { docs = typeof d.documents === "string" ? JSON.parse(d.documents) : (d.documents||[]); } catch(e) {} return {...d, documents: docs}; });
    render();
    // ── Tutoriel interactif : reprend si en cours ──
    if(window.ArtioTour) window.ArtioTour.autoStart();
  } catch(e) {
    document.getElementById("main").innerHTML = `<p style="padding:2rem;color:#f87171;">Erreur: ${e.message}</p>`;
  }
})();
</script>
<script src="chat-widget.js"></script>
<script>
  /* ── THEME TOGGLE ── */
  
  function toggleSidebar(){document.querySelector('.sidebar').classList.toggle('open');document.querySelector('.sidebar-overlay').classList.toggle('open');}
  function closeSidebar(){document.querySelector('.sidebar').classList.remove('open');document.querySelector('.sidebar-overlay').classList.remove('open');}
  async function _sidebarLogout(){await sb.auth.signOut();location.href='index.html';}
  function toggleTheme(){
    const cur=document.documentElement.getAttribute('data-theme')||'dark';
    const next=cur==='dark'?'light':'dark';
    document.documentElement.setAttribute('data-theme',next);
    try{localStorage.setItem('artio-theme',next);}catch(e){}
  }
</script>
