    .auth-card {

    /* ── PASSWORD CHECKLIST ── */
    .pwd-rules {

.theme-toggle { width:34px; height:34px; display:flex; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--border); border-radius:9px; cursor:pointer; color:var(--text); transition:all .2s; flex-shrink:0; }

<script>
/* CONFIG (auto local/prod) — voir settings.html pour le détail */
const IS_LOCAL = ["127.0.0.1", "localhost"].includes(window.location.hostname);
const SUPABASE_URL = IS_LOCAL
  ? "http://127.0.0.1:54321"
  : "https://mwmexkoeqeyueqgdkkni.supabase.co";
const SUPABASE_KEY = IS_LOCAL
  ? "sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH"
  : "sb_publishable_dbf0DrGQr377jyftcE-rYw_SK5nzZJw";
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

/* Version du corpus contractuel (CGV + CGU + Confidentialité).
   À incrémenter à chaque révision substantielle : les comptes dont
   profils.cgv_version diffère devront réaccepter. */
const CGV_VERSION = "2.4";

let S = {
  tab: (new URLSearchParams(location.search).get('tab') === 'register') ? 'register' : 'login',          // 'login' | 'register'
  view: 'auth',          // 'auth' | 'forgot' | 'forgot_sent'
  loading: false,
  error: '',
  success: '',
  // Valeurs persistées : render() reconstruit tout le DOM, sans ça
  // les champs saisis sont effacés à chaque set().
  email: '',
  pass: '',
  pass2: '',
  legalOk: false,
  forgotEmail: '',
};

const LABELS = {
  subtitle:       { fr:"Votre admin, pilotée par la voix",          en:"Your admin, powered by voice",              es:"Tu admin, controlada por voz",          zh:"语音驱动的行政管理" },
  tab_login:      { fr:"Se connecter",      en:"Log in",            es:"Iniciar sesión",      zh:"登录" },
  tab_register:   { fr:"Créer un compte",   en:"Create account",    es:"Crear cuenta",        zh:"注册" },
  email_lbl:      { fr:"Email",             en:"Email",             es:"Email",               zh:"邮箱" },
  pwd_lbl:        { fr:"Mot de passe",      en:"Password",          es:"Contraseña",          zh:"密码" },
  btn_login:      { fr:"Se connecter",      en:"Log in",            es:"Iniciar sesión",      zh:"登录" },
  btn_register:   { fr:"Créer mon compte",  en:"Create my account", es:"Crear mi cuenta",     zh:"创建账户" },
  btn_loading:    { fr:"…",                 en:"…",                 es:"…",                   zh:"…" },
  forgot_link:    { fr:"Mot de passe oublié ?", en:"Forgot password?", es:"¿Olvidaste tu contraseña?", zh:"忘记密码？" },
  forgot_title:   { fr:"Réinitialiser",     en:"Reset password",    es:"Restablecer contraseña", zh:"重置密码" },
  forgot_sub:     { fr:"Entrez votre email pour recevoir un lien de réinitialisation.", en:"Enter your email to receive a reset link.", es:"Ingresa tu email para recibir un enlace.", zh:"输入您的邮箱以接收重置链接。" },
  forgot_btn:     { fr:"Envoyer le lien",   en:"Send link",         es:"Enviar enlace",       zh:"发送链接" },
  forgot_sending: { fr:"Envoi…",            en:"Sending…",          es:"Enviando…",           zh:"发送中…" },
  sent_title:     { fr:"Email envoyé !",    en:"Email sent!",       es:"¡Email enviado!",     zh:"邮件已发送！" },
  sent_sub:       { fr:"Vérifiez votre boîte et vos spams.", en:"Check your inbox and spam.", es:"Revisa tu bandeja y spam.", zh:"请检查您的收件箱。" },
  back_login:     { fr:"← Retour à la connexion", en:"← Back to login", es:"← Volver al inicio de sesión", zh:"← 返回登录" },
  legal:          { fr:"Solution Compatible — réforme facturation électronique DGFiP 2026", en:"Compatible Solution — DGFiP 2026 e-invoicing reform", es:"Solución Compatible — DGFiP 2026", zh:"兼容解决方案 — DGFiP 2026" },
  err_required:   { fr:"Email et mot de passe requis.", en:"Email and password required.", es:"Email y contraseña requeridos.", zh:"请填写邮箱和密码。" },
  err_pass_length:  { fr:"8 caractères minimum.", en:"Minimum 8 characters.", es:"Mínimo 8 caracteres.", zh:"最少8个字符。" },
  err_pass_upper:   { fr:"Au moins une majuscule requise.", en:"At least one uppercase letter required.", es:"Se requiere al menos una mayúscula.", zh:"需要至少一个大写字母。" },
  err_pass_lower:   { fr:"Au moins une minuscule requise.", en:"At least one lowercase letter required.", es:"Se requiere al menos una minúscula.", zh:"需要至少一个小写字母。" },
  err_pass_digit:   { fr:"Au moins un chiffre requis.", en:"At least one number required.", es:"Se requiere al menos un número.", zh:"需要至少一个数字。" },
  err_pass_special: { fr:"Au moins un caractère spécial requis (!@#$…).", en:"At least one special character required (!@#$…).", es:"Se requiere al menos un carácter especial (!@#$…).", zh:"需要至少一个特殊字符。" },
  err_pass_mismatch:{ fr:"Les mots de passe ne correspondent pas.", en:"Passwords do not match.", es:"Las contraseñas no coinciden.", zh:"两次输入的密码不一致。" },
  err_legal:      { fr:"Vous devez accepter les CGV, CGU et la Politique de confidentialité.", en:"You must accept the Terms and Privacy Policy.", es:"Debes aceptar los términos y la política de privacidad.", zh:"您必须接受条款和隐私政策。" },
  pwd_confirm_lbl:{ fr:"Confirmer le mot de passe", en:"Confirm password", es:"Confirmar contraseña", zh:"确认密码" },
  pwd_match_ok:   { fr:"Les mots de passe correspondent.", en:"Passwords match.", es:"Las contraseñas coinciden.", zh:"密码一致。" },
  rule_length:    { fr:"8 caractères min.",   en:"8 characters min.",  es:"8 caracteres mín.",  zh:"至少8个字符" },
  rule_upper:     { fr:"Une majuscule",       en:"One uppercase",      es:"Una mayúscula",      zh:"一个大写字母" },
  rule_lower:     { fr:"Une minuscule",       en:"One lowercase",      es:"Una minúscula",      zh:"一个小写字母" },
  rule_digit:     { fr:"Un chiffre",          en:"One number",         es:"Un número",          zh:"一个数字" },
  rule_special:   { fr:"Un caractère spécial",en:"One special char.",  es:"Un carácter especial", zh:"一个特殊字符" },
  err_credentials:{ fr:"Identifiants incorrects.",      en:"Incorrect credentials.",        es:"Credenciales incorrectas.",     zh:"账号或密码错误。" },
  suc_register:   { fr:"Compte créé ! Vérifiez votre email pour confirmer.", en:"Account created! Check your email.", es:"¡Cuenta creada! Verifica tu email.", zh:"账户已创建！请验证您的邮箱。" },
  info_maybe_exists:{ fr:"Un compte existe déjà avec cette adresse email. Connectez-vous ou réinitialisez votre mot de passe.", en:"An account already exists with this email. Sign in or reset your password.", es:"Ya existe una cuenta con este email. Inicia sesión o restablece tu contraseña.", zh:"该邮箱已注册。请登录或重置密码。" },
};

function L(key) {
  const v = LABELS[key];
  if (!v) return key;
  return typeof v === 'string' ? v : (v.fr || key);
}

function set(patch) { Object.assign(S, patch); render(); }

/* Échappement pour injection dans un attribut HTML. */
function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

/* ── PASSWORD VALIDATION ── */
/* Règles unitaires : servent à la fois à la checklist visuelle
   et au blocage à la soumission. Une seule source de vérité. */
const PWD_RULES = [
  { key: 'rule_length',  test: p => p.length >= 8,           err: 'err_pass_length'  },
  { key: 'rule_upper',   test: p => /[A-Z]/.test(p),          err: 'err_pass_upper'   },
  { key: 'rule_lower',   test: p => /[a-z]/.test(p),          err: 'err_pass_lower'   },
  { key: 'rule_digit',   test: p => /[0-9]/.test(p),          err: 'err_pass_digit'   },
  { key: 'rule_special', test: p => /[^A-Za-z0-9]/.test(p),   err: 'err_pass_special' },
];

function validatePassword(pass) {
  for (const r of PWD_RULES) {
    if (!r.test(pass)) return L(r.err);
  }
  return null;
}

/* Mise à jour live de la checklist sans re-render complet
   (évite de perdre le focus / la position du curseur). */
function onPassInput(el) {
  S.pass = el.value;
  const list = document.getElementById('pwd-rules');
  if (list) {
    PWD_RULES.forEach(r => {
      const li = list.querySelector('[data-rule="' + r.key + '"]');
      if (li) li.classList.toggle('ok', r.test(S.pass));
    });
  }
  refreshMatch();
}

function onPass2Input(el) {
  S.pass2 = el.value;
  refreshMatch();
}

function refreshMatch() {
  const box = document.getElementById('pwd-match');
  if (!box) return;
  if (!S.pass2) { box.className = 'pwd-match'; box.textContent = ''; return; }
  const ok = S.pass === S.pass2;
  box.className = 'pwd-match ' + (ok ? 'ok' : 'ko');
  box.textContent = ok ? L('pwd_match_ok') : L('err_pass_mismatch');
}

/* ── ACCEPTATION LÉGALE ── */
/* L'acceptation CGV est posee cote serveur par le trigger
   on_auth_user_created_cgv, a la creation du compte. La version est
   transmise via options.data.cgv_version au signUp (voir handleAuth).
   Aucune ecriture cliente : au moment du signUp il n'y a pas de
   session, la RLS refuserait l'insert/update. */

/* ── AUTH HANDLERS ── */
async function handleAuth() {
  const email = (document.getElementById('auth-email')?.value || '').trim();
  const pass  = document.getElementById('auth-pass')?.value || '';
  const pass2 = document.getElementById('auth-pass2')?.value || '';
  const legalOk = !!document.getElementById('legal-accept')?.checked;
  const parrainCode = (document.getElementById('auth-parrain')?.value || '').trim().toUpperCase();

  // On persiste la saisie AVANT toute sortie en erreur : sans ça
  // le re-render efface les champs déjà remplis.
  S.email = email; S.pass = pass; S.pass2 = pass2; S.legalOk = legalOk; S.parrainCode = parrainCode;

  if (!email || !pass) { set({ error: L('err_required') }); return; }

  if (S.tab === 'login') {
    set({ loading: true, error: '', success: '' });
    const { error } = await sb.auth.signInWithPassword({ email, password: pass });
    if (error) set({ loading: false, error: L('err_credentials') });
    else window.location.href = 'home.html';
  } else {
    const passErr = validatePassword(pass);
    if (passErr) { set({ error: passErr }); return; }
    if (pass !== pass2) { set({ error: L('err_pass_mismatch') }); return; }
    if (!legalOk) { set({ error: L('err_legal') }); return; }

    set({ loading: true, error: '', success: '' });
    // La version des CGV est transmise dans les metadonnees du signup.
    // Le trigger serveur on_auth_user_created_cgv la recopie dans
    // profils avec cgv_accepted_at. On ne tente PLUS d'ecrire cote
    // client : au moment du signUp il n'y a pas de session, la RLS
    // refuserait l'ecriture.
    const { data, error } = await sb.auth.signUp({
      email,
      password: pass,
      options: { data: {
        cgv_version: CGV_VERSION,
        ...(parrainCode ? { code_parrainage: parrainCode } : {}),
      } },
    });
    if (error) { set({ loading: false, error: error.message }); return; }

    // Supabase ne renvoie pas d'erreur pour un email déjà enregistré
    // (protection anti-énumération). Le signal exploitable : sur un
    // email déjà pris, data.user.identities est un tableau vide, et
    // aucun email de confirmation n'est envoyé. On affiche alors un
    // message neutre, sans confirmer explicitement l'existence du compte.
    const alreadyExists = !!data.user
      && Array.isArray(data.user.identities)
      && data.user.identities.length === 0;

    if (alreadyExists) {
      set({ loading: false, error: L('info_maybe_exists'), pass: '', pass2: '' });
      return;
    }

    // L'acceptation CGV est posee par le trigger serveur, pas ici.

    // Conversion GA4 : compte reellement cree (email non deja pris).
    if (typeof gtag === 'function') {
      gtag('event', 'sign_up', { method: 'email' });
    }

    if (data.user && !data.session) {
      // Compte créé, confirmation email en attente : on vide les
      // mots de passe mais on garde l'email affiché.
      set({ loading: false, success: L('suc_register'), pass: '', pass2: '' });
    } else if (data.user) {
      window.location.href = 'home.html';
    } else {
      set({ loading: false });
    }
  }
}

async function handleForgot() {
  const email = (document.getElementById('forgot-email')?.value || '').trim();
  S.forgotEmail = email;
  if (!email) { document.getElementById('forgot-email')?.focus(); return; }
  set({ loading: true, error: '' });
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin + '/index.html' });
  if (error) set({ loading: false, error: error.message });
  else set({ loading: false, view: 'forgot_sent' });
}

/* ── RENDER ── */
function render() {
  const root = document.getElementById('root');

  if (S.view === 'forgot') {
    root.innerHTML = `
      <div class="auth-header">
        <div class="logo"><img src="artio-icon.png" alt=""><span>Artio</span></div>
        <p class="auth-tagline">${L('subtitle')}</p>
      </div>
      <div class="auth-card">

        <div style="margin-bottom:20px">
          <div style="font-family:var(--fh);font-size:20px;font-weight:700;margin-bottom:6px">${L('forgot_title')}</div>
          <div style="font-size:13px;color:var(--muted);line-height:1.65">${L('forgot_sub')}</div>
        </div>
        ${S.error ? `<div class="msg error">${S.error}</div>` : ''}
        <div class="field">
          <label class="field-label">Email</label>
          <input id="forgot-email" class="field-input" type="email" placeholder="contact@email.com"
            value="${esc(S.forgotEmail)}"
            oninput="S.forgotEmail=this.value"
            onkeydown="if(event.key==='Enter')handleForgot()"/>
        </div>
        <button class="btn-primary" ${S.loading ? 'disabled' : ''} onclick="handleForgot()">
          ${S.loading ? L('forgot_sending') : L('forgot_btn')}
        </button>
        <button class="btn-ghost" onclick="set({view:'auth',error:''})">
          ${L('back_login')}
        </button>
      </div>
      <div class="legal-badge">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <span>${L('legal')}</span>
      </div>`;
    return;
  }

  if (S.view === 'forgot_sent') {
    root.innerHTML = `
      <div class="auth-header">
        <div class="logo"><img src="artio-icon.png" alt=""><span>Artio</span></div>
      </div>
      <div class="auth-card">
        <div class="sent-box">
          <div class="sent-icon">📬</div>
          <div class="sent-title">${L('sent_title')}</div>
          <p class="sent-sub">${L('sent_sub')}</p>
        </div>
        <button class="btn-ghost" onclick="set({view:'auth',error:''})">
          ${L('back_login')}
        </button>
      </div>`;
    return;
  }

  // Main auth view
  root.innerHTML = `
    <div class="auth-header">
      <div class="logo"><img src="artio-icon.png" alt=""><span>Artio</span></div>
      <p class="auth-tagline">${L('subtitle')}</p>
    </div>
    <div class="auth-card">

      <div class="auth-tabs">
        <button class="auth-tab ${S.tab === 'login' ? 'active' : ''}" onclick="set({tab:'login',error:'',success:'',pass:'',pass2:''})">${L('tab_login')}</button>
        <button class="auth-tab ${S.tab === 'register' ? 'active' : ''}" onclick="set({tab:'register',error:'',success:'',pass:'',pass2:''})">${L('tab_register')}</button>
      </div>
      ${S.error   ? `<div class="msg error">${S.error}</div>`   : ''}
      ${S.success ? `<div class="msg success">${S.success}</div>` : ''}
      <div class="field">
        <label class="field-label">${L('email_lbl')}</label>
        <input id="auth-email" class="field-input" type="email" placeholder="contact@email.com"
          autocomplete="email"
          value="${esc(S.email)}"
          oninput="S.email=this.value"
          onkeydown="if(event.key==='Enter')document.getElementById('auth-pass').focus()"/>
      </div>
      <div class="field">
        <label class="field-label">${L('pwd_lbl')}</label>
        <input id="auth-pass" class="field-input" type="password" placeholder="••••••••"
          autocomplete="${S.tab === 'login' ? 'current-password' : 'new-password'}"
          value="${esc(S.pass)}"
          oninput="${S.tab === 'register' ? 'onPassInput(this)' : 'S.pass=this.value'}"
          onkeydown="if(event.key==='Enter'){${S.tab === 'register' ? "document.getElementById('auth-pass2').focus()" : 'handleAuth()'}}"/>
        ${S.tab === 'register' ? `
        <ul class="pwd-rules" id="pwd-rules">
          ${PWD_RULES.map(r => `
          <li class="pwd-rule ${r.test(S.pass) ? 'ok' : ''}" data-rule="${r.key}">
            <span class="tick">✓</span><span>${L(r.key)}</span>
          </li>`).join('')}
        </ul>` : ''}
      </div>
      ${S.tab === 'register' ? `
      <div class="field">
        <label class="field-label">${L('pwd_confirm_lbl')}</label>
        <input id="auth-pass2" class="field-input" type="password" placeholder="••••••••"
          autocomplete="new-password"
          value="${esc(S.pass2)}"
          oninput="onPass2Input(this)"
          onkeydown="if(event.key==='Enter')handleAuth()"/>
        <div class="pwd-match${S.pass2 ? (S.pass === S.pass2 ? ' ok' : ' ko') : ''}" id="pwd-match">${
          S.pass2 ? (S.pass === S.pass2 ? L('pwd_match_ok') : L('err_pass_mismatch')) : ''
        }</div>
      </div>
      <div class="field">
        <label class="field-label">Code de parrainage <span style="color:var(--muted);font-weight:400">(optionnel)</span></label>
        <input id="auth-parrain" class="field-input" type="text" placeholder="Ex : 2FP5QD2V"
          maxlength="8"
          autocapitalize="characters"
          value="${esc(S.parrainCode || '')}"
          oninput="S.parrainCode=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'')"/>
      </div>
      <label class="legal-accept" for="legal-accept">
        <input type="checkbox" id="legal-accept" ${S.legalOk ? 'checked' : ''}
          oninput="S.legalOk=this.checked"/>
        <span class="legal-accept-txt">
          J'ai lu et j'accepte les
          <a href="cgv.html" target="_blank" rel="noopener">Conditions Générales de Vente</a>,
          les <a href="cgu.html" target="_blank" rel="noopener">Conditions Générales d'Utilisation</a>
          et la <a href="confidentialite.html" target="_blank" rel="noopener">Politique de confidentialité</a>.
        </span>
      </label>` : ''}
      <button class="btn-primary" ${S.loading ? 'disabled' : ''} onclick="handleAuth()">
        ${S.loading ? L('btn_loading') : (S.tab === 'login' ? L('btn_login') : L('btn_register'))}
      </button>
      ${S.tab === 'login' ? `
      <p style="text-align:center;margin-top:14px">
        <button class="link-btn" onclick="set({view:'forgot',error:''})">
          ${L('forgot_link')}
        </button>
      </p>` : ''}
    </div>
    <div class="legal-badge">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span>${L('legal')}</span>
    </div>`;

}

/* ── INIT ── */

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) { window.location.href = 'home.html'; return; }
  render();
})();

  /* ── THEME ── */
  function toggleTheme() {
    const cur = document.documentElement.getAttribute('data-theme') || 'light';
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('artio-theme', next); } catch(e) {}
  }
  (function initTheme() {
    let saved = 'light';
    try { saved = localStorage.getItem('artio-theme') || 'light'; } catch(e) {}
    document.documentElement.setAttribute('data-theme', saved);
  })();
</script>
</body>
