<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Connexion Google — Artio</title>
  <style>
    :root { color-scheme: light dark; }
    html, body {
      margin: 0; height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #faf8f3; color: #1a1a1a;
    }
    @media (prefers-color-scheme: dark) {
      html, body { background: #080b14; color: #faf8f3; }
    }
    .wrap {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; padding: 24px;
      text-align: center;
    }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(217,119,6,0.25); border-top-color: #d97706;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg { font-size: 15px; opacity: 0.85; max-width: 320px; line-height: 1.5; }
    .fallback { display: none; }
    .fallback a {
      display: inline-block; margin-top: 12px; padding: 12px 20px;
      background: #d97706; color: #fff; text-decoration: none;
      border-radius: 10px; font-weight: 600; font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="spinner" id="spinner"></div>
    <p class="msg" id="msg">Retour vers l'application Artio…</p>
    <div class="fallback" id="fallback">
      <p class="msg">Si l'application ne s'ouvre pas automatiquement :</p>
      <a id="manualLink" href="#">Ouvrir Artio</a>
    </div>
  </div>

  <script>
    // ────────────────────────────────────────────────────────────
    // Page de rebond OAuth natif.
    //
    // Google (Web Client artio-495216) redirige ici en HTTPS après le
    // consentement — le schéma custom fr.monartio.app:// n'étant PAS
    // accepté comme redirect_uri d'un client Web, on passe par cette
    // page qui se contente de RELAYER tel quel (code, state, scope,
    // error…) vers le schéma natif de l'app.
    //
    // Aucune donnée n'est stockée ni envoyée ailleurs : simple relais
    // client-side. La query string reçue de Google est réémise à
    // l'identique vers le deep link, qu'expo-auth-session capte.
    // ────────────────────────────────────────────────────────────
    (function () {
      var APP_SCHEME = 'fr.monartio.app://';

      // Récupère la query string brute (après le ?) telle que renvoyée
      // par Google : code=...&scope=...&state=... (ou error=...).
      var rawQuery = window.location.search || '';
      // Google peut aussi renvoyer certains paramètres dans le fragment
      // selon le response_type ; on concatène par sécurité.
      var rawHash = window.location.hash ? window.location.hash.replace(/^#/, '') : '';

      var query = rawQuery.replace(/^\?/, '');
      if (rawHash) {
        query = query ? (query + '&' + rawHash) : rawHash;
      }

      var deepLink = APP_SCHEME + (query ? ('?' + query) : '');

      // Prépare le lien manuel de repli.
      var manual = document.getElementById('manualLink');
      if (manual) manual.setAttribute('href', deepLink);

      // Tente l'ouverture automatique immédiate.
      try {
        window.location.replace(deepLink);
      } catch (e) {
        window.location.href = deepLink;
      }

      // Si l'app ne s'est pas ouverte au bout de 1,5 s (l'onglet est
      // toujours au premier plan), afficher le repli manuel.
      setTimeout(function () {
        var spinner = document.getElementById('spinner');
        var msg = document.getElementById('msg');
        var fallback = document.getElementById('fallback');
        if (spinner) spinner.style.display = 'none';
        if (msg) msg.style.display = 'none';
        if (fallback) fallback.style.display = 'block';
      }, 1500);
    })();
  </script>
</body>
</html>
